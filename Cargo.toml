[package]
name = "echovr-installer"
version = "0.9.5"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Echo VR Installer / Launcher"
repository = "https://github.com/marshmallow-mia/Echo-VR-Installer"
build = "build.rs"

[[bin]]
name = "EchoVR_Installer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
arboard = { version = "3", default-features = false }
dirs = "7.0.0"
eframe = "0.36.2"
egui = "0.36.2"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
open = "5.4.4"
rand = "0.10.3"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "local-offset"] }
tiny_http = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# TLS: the OS stack on Windows (SChannel) and macOS (Security.framework); rustls+ring on
# Linux so the portable build does not depend on a particular libssl.so.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "http2", "system-proxy"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
mslnk = "0.1.8"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
